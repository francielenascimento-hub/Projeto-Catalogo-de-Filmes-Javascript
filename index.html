<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Filmes</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>

</head>

<body>
    <header>
        <h1>Catálogo de Filmes</h1>
    </header>

    <main>
        <!-- R3: Busca e Filtro -->
        <section id="controles">
            
            <div class="campo">
                <label for="busca">Buscar Filme</label>
                <input type="text" id="busca" placeholder="Digite o nome do filme">
            </div>
            
            <div class="campo">
                <label for="filtro-categoria">Categoria</label>
                <select id="filtro-categoria">
                    <option value="todas">Todas</option>
                    <option value="acao">Ação</option>
                    <option value="aventura">Aventura</option>
                    <option value="comedia">Comédia</option>
                    <option value="crime">Crime</option>
                    <option value="drama">Drama</option>
                    <option value="ficcao">Ficção</option>
                    <option value="terror">Terror</option>
                    <option value="romance">Romance</option>
                    <option value="animacao">Animção</option>
                </select>
            </div>
            
        </section>

        <!-- R6: Painel -->
        <section id="painel">

        </section>

        <!-- R2: Lista -->
        <section id="lista">

        </section>

        <!-- R4: Formulário de Cadastro -->
        <section id="cadastro">
            
            <h2>Cadastrar Filme</h2>

            <form id="form-filme" novalidate>

                <div class="campo">
                    <label for="nome">Nome do filme</label>
                    <input type="text" id="nome" placeholder="Exemplo: A Origem">
                </div>

                <div class="campo">
                    <label for="nota">Nota (de 0 a 10)</label>
                    <input type="text" id="nota" inputmode="decimal" placeholder="Exemplo: 8.6">
                </div>

                <div class="campo">
                    <label for="ano">Ano de lançamento</label>
                    <input type="text" id="ano" inputmode="numeric" placeholder="Exemplo: 2014">
                </div>
                
                <div class="campo">
                        <label for="categoria">Categoria</label>
                        <select id="categoria">
                        <option value="">Selecione a categoria</option>
                        <option value="acao">Ação</option>
                        <option value="aventura">Aventura</option>
                        <option value="comedia">Comédia</option>
                        <option value="crime">Crime</option>
                        <option value="drama">Drama</option>
                        <option value="ficcao">Ficção</option>
                        <option value="terror">Terror</option>
                        <option value="romance">Romance</option>
                        <option value="animacao">Animação</option>
                    </select>
                </div>

                <div class="campo campo-maior">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" rows="4" placeholder="Escreva um resumo sobre o filme"></textarea>
                </div>

                <button type="submit">Cadastrar filme</button>

            </form>
            
            <p id="mensagem" aria-live="polite"></p>

        </section>
    </main>

    <footer>
        <p>Desenvolvimento Web · Análise e Desenvolvimento de Sistemas</p>
        <p>FATEC Ribeirão Preto</p>
    </footer>

</body>

</html>
